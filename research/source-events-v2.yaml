setting_families:
  - id: first-person-statement
    classification_priority: 1
    definition: An authored or directly attributed public statement delivered without interviewer turns.
    distinguishing_rule: Use only when the source boundary is a speaker-controlled statement rather than any question-and-answer exchange.
  - id: adversarial-interview
    classification_priority: 2
    definition: An interview organized around repeated direct challenges to identity, credibility, conduct, or contested choices.
    distinguishing_rule: A difficult isolated question is insufficient; sustained challenge must shape the interaction.
  - id: public-service
    classification_priority: 3
    definition: A communication centered on a named civic, educational, philanthropic, or public-benefit program.
    distinguishing_rule: Program mechanics and beneficiaries must dominate over general career or promotional discussion.
  - id: workplace-interview
    classification_priority: 4
    definition: An interview centered on management, labor, organizational decisions, or professional operating practice.
    distinguishing_rule: Workplace decision-making must be the primary frame rather than incidental career discussion.
  - id: structured-prompt-interview
    classification_priority: 5
    definition: A publisher-defined repeatable format using standardized prompts, cards, searches, or rapid discrete questions.
    distinguishing_rule: The repeatable prompt mechanism must determine turn structure, not merely provide an interview title.
  - id: formal-qa
    classification_priority: 6
    definition: An institutionally moderated public address, press event, or luncheon followed by formal questions and answers.
    distinguishing_rule: A moderator and public-event protocol distinguish this setting from ordinary editorial interviews.
  - id: informal-candid-interview
    classification_priority: 7
    definition: A contemporaneous editorial interview conducted as an open-ended personal conversation outside a staged program format.
    distinguishing_rule: Original conversational purpose controls; later archival republication does not turn it into an archival interview.
  - id: archival-interview
    classification_priority: 8
    definition: A retrospective interview commissioned by a preservation or archive institution to document historical experience.
    distinguishing_rule: The original interview purpose must be preservation or documentation, not merely later archive hosting.
  - id: long-form-audio
    classification_priority: 9
    definition: An extended broadcast or podcast audio interview not matched by a more specific controlled setting.
    distinguishing_rule: Use as the audio-format fallback only after applying priorities one through eight.
  - id: long-form-video
    classification_priority: 10
    definition: An extended broadcast or publisher video interview not matched by a more specific controlled setting.
    distinguishing_rule: Use as the video-format fallback only after applying priorities one through nine.
