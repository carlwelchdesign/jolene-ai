pdf_protocol:
  id: pdf-boundary-protocol-v2
  runtime:
    python: 3.12.13
    pdfplumber: 0.11.9
    pdfminer_six: "20251230"
    pypdf: 6.10.0
    version_drift: fail-closed
    ocr_fallback: prohibited
  labeled_pdf_extraction:
    sources: [S04, S08, S09]
    method: pdfplumber-extract-text-lines
    x_tolerance: 3
    y_tolerance: 3
    layout: false
    strip: true
    return_chars: false
    ordering: page-top-x0-original-index
    normalization: nfc-trim-discard-empty
  furniture:
    repeated_margin_band_fraction: 0.10
    repeated_exact_line_minimum_pages: 3
    page_number_regex: "^(?:PAGE\\s+)?\\d+$"
    labels_exempt: true
    source_control_regex:
      S04: "^END$"
      S08: "^(?:ACT\\s+\\d+[A-Z]?|END TRANSCRIPT)$"
      S09: null
  label_regex:
    S04: "^(MS\\. PARTON|MS\\. LEINWAND|MODERATOR):?\\s*(.*)$"
    S08: "^(DOLLY PARTON|PARTON|DAN RATHER \\(VOICE OVER\\)|RATHER \\(VOICE OVER\\)|DAN RATHER|RATHER)$"
    S09: "^(DP|LOC):\\s*(.*)$"
  cue_handling:
    performance: [SING, SINGS, SINGING, MUSIC, PERFORMANCE]
    nonverbal: [LAUGH, LAUGHTER, APPLAUSE, AFFIRM]
    unreadable: [INAUDIBLE, UNINTEL, UNINTELLIGIBLE]
    performance_result: exclude-whole-block-lyric-or-performance
    embedded_nonverbal_result: remove-cue-retain-spoken-payload
    cue_only_result: controlled-exclusion
  fragment_rule:
    token_regex: "[A-Za-z0-9]+(?:['’][A-Za-z0-9]+)?"
    maximum_tokens: 4
    closed_token_set: ["yes", "no", yeah, yep, right, exactly, sure, okay, ok, absolutely, certainly, well, oh, and, uh, huh, mm, thank, you, "true", correct, indeed]
    result: exclude-too-fragmentary-only-when-all-tokens-in-closed-set
  attributed_statement_extraction:
    sources: [S18]
    method: pypdf-layout
    extraction_mode: layout
    layout_mode_space_vertically: true
    layout_mode_scale_weight: 1.25
    layout_mode_strip_rotated: true
    layout_mode_font_height_weight: 1
    paragraph_split_regex: "\\n[ \\t]*\\n+"
    cross_page_merge_unless_prior_ends_regex: "[.!?][\"”'\\)\\]]*$"
    named_attribution_regex: "(?i)\\bDolly\\s+Parton\\s+(?:said|says|stated|states|added|adds|commented)\\s*,?\\s*[\"“]"
    continuation_regex: "(?i)\\b(?:she|Parton)\\s+(?:adds?|continues?|said|says|states?|notes?)\\s*,?\\s*[\"“]"
    continuation_scope: immediately-following-before-intervening-speaker
  reproduced_capacity:
    S04: { boundary_units: 101, eligible_units: 48 }
    S08: { boundary_units: 199, eligible_units: 88 }
    S09: { boundary_units: 11, eligible_units: 5 }
    S18: { boundary_units: 19, eligible_units: 2 }
