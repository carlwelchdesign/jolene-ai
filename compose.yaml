name: jolene

x-jolene-runtime: &jolene-runtime
  build:
    context: .
    target: runtime
  image: jolene-ai:local
  env_file:
    - path: .env.runtime.local
      required: false
  environment: &jolene-environment
    OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
    JOLENE_DATABASE_PATH: /data/jolene.sqlite
    JOLENE_HOST: 0.0.0.0
    JOLENE_OBSIDIAN_VAULT_ROOT: /vault
    JOLENE_PORT: 8421
    JOLENE_WATCHED_PROJECTS: >-
      [{"id":"carl-welch-portfolio","label":"Carl Welch Portfolio","rootPath":"/watched/carl-welch-portfolio","planFile":"PORTFOLIO_SITE_PLAN.md","reviewWindowDays":30,"monitoring":{"enabled":true,"cadenceMinutes":60,"maxRunsPerDay":24,"stopAfterRuns":720,"historyLimit":100,"notifications":{"enabled":true,"destination":"slack_owner_dm","maxAttempts":5}}}]
    JOLENE_PRIVATE_BRIEFING: >-
      {"enabled":true,"destination":"slack_owner_dm","frequency":"daily","dayOfWeek":null,"localHour":8,"localMinute":0,"timeZone":"America/Los_Angeles","maxDeliveriesPerDay":1,"stopAfterDeliveries":365,"historyLimit":90,"maxAttempts":5}
    JOLENE_CAREER_EMBEDDINGS_ENABLED: ${JOLENE_CAREER_EMBEDDINGS_ENABLED:-false}
    JOLENE_PUBLIC_LIVE_REVIEW_PACKET_PATH: /review/public-live-model-review.json
    JOLENE_PUBLIC_LIVE_REVIEW_DECISION_PATH: /data/evaluations/public-live-model-decision.json
    JOLENE_PERSONALITY_RESEARCH_DECISION_PATH: /data/personality/research-decision.json
  volumes:
    - jolene-data:/data
    - type: bind
      source: ${JOLENE_OBSIDIAN_VAULT_HOST_PATH:?Set JOLENE_OBSIDIAN_VAULT_HOST_PATH in the ignored .env file}
      target: /vault
      read_only: true
    - type: bind
      source: ${JOLENE_PORTFOLIO_ROOT:-../carl-welch-portfolio}
      target: /watched/carl-welch-portfolio
      read_only: true
  secrets:
    - openai_api_key
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

services:
  jolene-api:
    <<: *jolene-runtime
    command: ["node", "dist/server.js"]
    volumes:
      - jolene-data:/data
      - type: bind
        source: ${JOLENE_OBSIDIAN_VAULT_HOST_PATH:?Set JOLENE_OBSIDIAN_VAULT_HOST_PATH in the ignored .env file}
        target: /vault
        read_only: true
      - type: bind
        source: ./.jolene/evaluations
        target: /review
        read_only: true
      - type: bind
        source: ${JOLENE_PORTFOLIO_ROOT:-../carl-welch-portfolio}
        target: /watched/carl-welch-portfolio
        read_only: true
    ports:
      - "127.0.0.1:${JOLENE_HOST_PORT:-8421}:8421"

  jolene-slack:
    <<: *jolene-runtime
    command: ["node", "dist/slack.js"]
    environment:
      <<: *jolene-environment
      SLACK_APP_TOKEN_FILE: /run/secrets/slack_app_token
      SLACK_BOT_TOKEN_FILE: /run/secrets/slack_bot_token
    secrets:
      - openai_api_key
      - slack_app_token
      - slack_bot_token
    healthcheck:
      disable: true
    depends_on:
      jolene-api:
        condition: service_healthy

  jolene-monitor:
    <<: *jolene-runtime
    command: ["node", "dist/project-monitor.js"]
    healthcheck:
      disable: true
    depends_on:
      jolene-api:
        condition: service_healthy

  jolene-career-export:
    build:
      context: .
      target: runtime
    image: jolene-ai:local
    command: ["node", "dist/career-export.js"]
    profiles: ["tools"]
    environment:
      JOLENE_DATABASE_PATH: /data/jolene.sqlite
      JOLENE_PUBLIC_CAREER_EXPORT_PATH: /exports/public-career-evidence.json
      JOLENE_OWNER_ACTOR_ID: ${JOLENE_OWNER_ACTOR_ID:-carl}
      JOLENE_CAREER_WORKSPACE_ID: ${JOLENE_CAREER_WORKSPACE_ID:-professional}
    volumes:
      - jolene-data:/data
      - type: bind
        source: ./.jolene/exports
        target: /exports
    init: true
    read_only: true
    network_mode: none
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"
    healthcheck:
      disable: true

  jolene-career-mcp:
    build:
      context: .
      target: runtime
    image: jolene-ai:local
    command: ["node", "dist/private-career-mcp.js"]
    profiles: ["tools"]
    environment:
      JOLENE_MCP_DATABASE_PATH: /data/jolene.sqlite
      JOLENE_MCP_ACTOR_ID: ${JOLENE_OWNER_ACTOR_ID:-carl}
      JOLENE_MCP_WORKSPACE_ID: ${JOLENE_CAREER_WORKSPACE_ID:-professional}
      JOLENE_MCP_CLIENT_ID: ${JOLENE_MCP_CLIENT_ID:-codex-local}
    volumes:
      - jolene-data:/data
    stdin_open: true
    init: true
    read_only: true
    network_mode: none
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"
    healthcheck:
      disable: true

  jolene-career-topology-audit:
    build:
      context: .
      target: runtime
    image: jolene-ai:local
    command: ["node", "dist/career-topology.js"]
    profiles: ["tools"]
    environment:
      JOLENE_DATABASE_PATH: /data/jolene.sqlite
      JOLENE_OWNER_ACTOR_ID: ${JOLENE_OWNER_ACTOR_ID:-carl}
      JOLENE_CAREER_WORKSPACE_ID: ${JOLENE_CAREER_WORKSPACE_ID:-professional}
    volumes:
      - jolene-data:/data:ro
    init: true
    read_only: true
    network_mode: none
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"
    healthcheck:
      disable: true

volumes:
  jolene-data:

secrets:
  openai_api_key:
    file: ./.jolene/secrets/openai-api-key
  slack_app_token:
    file: ./.jolene/secrets/slack-app-token
  slack_bot_token:
    file: ./.jolene/secrets/slack-bot-token
