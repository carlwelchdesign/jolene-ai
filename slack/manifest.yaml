_metadata:
  major_version: 1
  minor_version: 1
display_information:
  name: Jolene
  description: A private, policy-gated chief-of-staff agent for Carl
  background_color: "#5c2751"
features:
  bot_user:
    display_name: Jolene
    always_online: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - im:history
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
  org_deploy_enabled: false
  socket_mode_enabled: true
  is_hosted: false
  token_rotation_enabled: false
